name: DarkGPT
options:
  bundleIdPrefix: chat.darkgpt
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
targets:
  DarkGPT:
    type: application
    platform: iOS
    sources:
      - path: DarkGPT
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: DarkGPT
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSPhotoLibraryUsageDescription: "DarkGPT accède à tes photos uniquement pour envoyer une image à l'IA."
        NSCameraUsageDescription: "DarkGPT utilise l'appareil photo pour envoyer des photos à l'IA."
        NSMicrophoneUsageDescription: "DarkGPT utilise le micro pour la dictée vocale de tes messages."
        NSSpeechRecognitionUsageDescription: "DarkGPT utilise la reconnaissance vocale pour transcrire tes messages."
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: chat.darkgpt.ios
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
        ENABLE_PREVIEWS: "NO"
